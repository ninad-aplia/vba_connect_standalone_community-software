# GCP single-VM full stack: Loop + MeetNote integrated.
# Run:
#   docker compose -f deploy/docker-compose.gcp.yml --env-file deploy/.env.gcp up -d --build
#
# Prereq: copy deploy/.env.gcp.example -> deploy/.env.gcp and fill secrets;
#         copy deploy/livekit.prod.yaml.example -> deploy/livekit.prod.yaml and fill keys.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-loop_db}
      MYSQL_USER: ${DB_USER:-loop}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50100-50120:50100-50120/udp"
    depends_on:
      - redis

  egress:
    image: livekit/egress:v1.13.0
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - ${LOOP_RECORDINGS_HOST_PATH:-/srv/recordings}:/out
    depends_on:
      - livekit
      - redis

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-loop-backend:gcp}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      PORT: "8080"
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS}
      LIVEKIT_HOST: ${LIVEKIT_HOST:-http://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-loop}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-loop_db}
      DB_SYNC: ${DB_SYNC:-true}
      FFMPEG_PATH: /usr/bin/ffmpeg
      LOOP_RECORDINGS_PATH: ${LOOP_RECORDINGS_PATH:-/srv/recordings}
      MEETNOTE_BASE_URL: http://meetnote-backend:8000
      MEETNOTE_SERVICE_EMAIL: ${MEETNOTE_SERVICE_EMAIL}
      MEETNOTE_SERVICE_PASSWORD: ${MEETNOTE_SERVICE_PASSWORD}
      MEETNOTE_POLL_INTERVAL_MS: "5000"
      MEETNOTE_MAX_POLL_ATTEMPTS: "120"
    volumes:
      - ${LOOP_RECORDINGS_HOST_PATH:-/srv/recordings}:/srv/recordings

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL}
    image: ${FRONTEND_IMAGE:-loop-web:gcp}
    restart: unless-stopped
    depends_on:
      - backend

  meetnote-backend:
    build:
      context: ../MeetNote/backend
      dockerfile: Dockerfile
    image: ${MEETNOTE_BACKEND_IMAGE:-meetnote-backend:gcp}
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/meetnote.db
      JWT_SECRET_KEY: ${MEETNOTE_JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      FRONTEND_URL: ${MEETNOTE_FRONTEND_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY}
    volumes:
      - ${MEETNOTE_DATA_HOST_PATH:-/srv/meetnote}:/data
      - ${MEETNOTE_DATA_HOST_PATH:-/srv/meetnote}/uploads:/app/uploads

  meetnote-web:
    build:
      context: ../MeetNote/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${MEETNOTE_API_DOMAIN}
    image: ${MEETNOTE_FRONTEND_IMAGE:-meetnote-web:gcp}
    restart: unless-stopped
    depends_on:
      - meetnote-backend

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      LOOP_DOMAIN: ${LOOP_DOMAIN}
      MEETNOTE_DOMAIN: ${MEETNOTE_DOMAIN}
      MEETNOTE_API_DOMAIN: ${MEETNOTE_API_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend
      - meetnote-web
      - meetnote-backend
      - livekit

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  mysql_data:
